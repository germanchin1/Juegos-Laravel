<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>body { margin: 0; background: #000; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO, width: 400, height: 400,
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };
    let snake, food, cursors, direction = 'right', lastMoveTime = 0, moveInterval = 150;
    new Phaser.Game(config);
    function preload() {}
    function create() {
        snake = this.add.group();
        for(let i=0; i<3; i++) snake.create(100 - i*20, 100, null).setOrigin(0).setDisplaySize(18, 18).setData('x', 100-i*20).setData('y', 100);
        snake.children.iterate((c, i) => c.setAlpha(1).setTint(i===0 ? 0x00ff00 : 0x00aa00));
        food = this.add.rectangle(200, 200, 18, 18, 0xff0000).setOrigin(0);
        cursors = this.input.keyboard.createCursorKeys();
    }
    function update(time) {
        if (cursors.left.isDown && direction !== 'right') direction = 'left';
        else if (cursors.right.isDown && direction !== 'left') direction = 'right';
        else if (cursors.up.isDown && direction !== 'down') direction = 'up';
        else if (cursors.down.isDown && direction !== 'up') direction = 'down';
        if (time < lastMoveTime + moveInterval) return;
        lastMoveTime = time;
        let head = snake.getChildren()[0];
        let newX = head.x, newY = head.y;
        if (direction === 'left') newX -= 20;
        else if (direction === 'right') newX += 20;
        else if (direction === 'up') newY -= 20;
        else if (direction === 'down') newY += 20;
        if (newX < 0 || newX >= 400 || newY < 0 || newY >= 400) return this.scene.restart();
        if (newX === food.x && newY === food.y) {
            food.x = Phaser.Math.Between(0, 19) * 20;
            food.y = Phaser.Math.Between(0, 19) * 20;
            let tail = snake.create(0, 0, null).setOrigin(0).setDisplaySize(18, 18).setTint(0x00aa00);
        }
        let children = snake.getChildren();
        for (let i = children.length - 1; i > 0; i--) {
            children[i].x = children[i-1].x;
            children[i].y = children[i-1].y;
        }
        head.x = newX; head.y = newY;
    }
</script>
</body>
</html>
