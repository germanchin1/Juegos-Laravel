<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO, width: 800, height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 300 } } },
        scene: { preload: preload, create: create, update: update }
    };
    let player, stars, platforms, score = 0, scoreText, gameOver = false;
    new Phaser.Game(config);
    function preload() {
        this.load.image('sky', 'https://labs.phaser.io/assets/skies/space3.png');
        this.load.image('star', 'https://labs.phaser.io/assets/demoscene/ball-tuna.png');
        this.load.image('bomb', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
    }
    function create() {
        this.add.image(400, 300, 'sky');
        player = this.add.circle(400, 500, 15, 0x00ff00);
        this.physics.add.existing(player);
        player.body.setCollideWorldBounds(true);
        player.body.setAllowGravity(false);
        stars = this.physics.add.group();
        this.time.addEvent({ delay: 1000, callback: () => {
            let x = Phaser.Math.Between(0, 800);
            let s = stars.create(x, 0, 'star').setScale(0.5);
            s.setVelocityY(Phaser.Math.Between(100, 300));
        }, callbackScope: this, loop: true });
        scoreText = this.add.text(16, 16, 'Evitados: 0', { fontSize: '32px', fill: '#fff' });
        this.physics.add.overlap(player, stars, () => {
            this.physics.pause();
            player.setFillStyle(0xff0000);
            gameOver = true;
            this.add.text(250, 250, 'GAME OVER', { fontSize: '64px', fill: '#f00' });
        }, null, this);
    }
    function update() {
        if (gameOver) return;
        let cursors = this.input.keyboard.createCursorKeys();
        if (cursors.left.isDown) player.body.setVelocityX(-400);
        else if (cursors.right.isDown) player.body.setVelocityX(400);
        else player.body.setVelocityX(0);
        stars.children.iterate(child => {
            if (child && child.y > 600) {
                child.destroy();
                score++;
                scoreText.setText('Evitados: ' + score);
            }
        });
    }
</script>
</body>
</html>
